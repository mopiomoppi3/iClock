<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>置時計</title>
<link rel="icon" id="fav" href="data:,">
<link rel="apple-touch-icon" id="ati" sizes="180x180" href="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Cormorant+Garamond:wght@300;400&family=Zen+Maru+Gothic:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{--bg:#000;--fg:#f5f5f7;--sub:rgba(245,245,247,.55);--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.14);--acc:#f5f5f7;--onacc:#000;--sheet:rgba(40,40,44,.72);--ftxt:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",sans-serif;--fnum:"Jost","Helvetica Neue",sans-serif;--wn:200;--cs:1;--bh:40px;
--spring:cubic-bezier(.2,.9,.25,1.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
[data-theme=light]{--bg:#f2f2f7;--fg:#1c1c1e;--sub:rgba(28,28,30,.5);--glass:rgba(255,255,255,.7);--line:rgba(0,0,0,.08);--acc:#1c1c1e;--onacc:#fff;--sheet:rgba(255,255,255,.8)}
[data-theme=pink]{--bg:linear-gradient(160deg,#ffe3ee,#ffc2d8);--fg:#5b1a36;--sub:rgba(91,26,54,.55);--glass:rgba(255,255,255,.5);--line:rgba(255,255,255,.7);--acc:#ff4f87;--onacc:#fff;--sheet:rgba(255,240,246,.82)}
[data-theme=blue]{--bg:linear-gradient(160deg,#0a2a5e,#06142e);--fg:#eaf3ff;--sub:rgba(234,243,255,.6);--glass:rgba(120,180,255,.14);--line:rgba(160,200,255,.22);--acc:#5ac8fa;--onacc:#04132b;--sheet:rgba(10,35,80,.8)}
[data-theme=mint]{--bg:linear-gradient(160deg,#d9f7ea,#a8e6cf);--fg:#123d2d;--sub:rgba(18,61,45,.55);--glass:rgba(255,255,255,.5);--line:rgba(255,255,255,.7);--acc:#1fa971;--onacc:#fff;--sheet:rgba(236,252,245,.82)}
[data-theme=purple]{--bg:linear-gradient(160deg,#2a1450,#120726);--fg:#f1e9ff;--sub:rgba(241,233,255,.6);--glass:rgba(190,150,255,.14);--line:rgba(200,170,255,.22);--acc:#c79bff;--onacc:#180a30;--sheet:rgba(40,20,80,.8)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
font-family:var(--ftxt);user-select:none;-webkit-user-select:none}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2vmin;padding:44px max(18px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px)*.4 + 14px);
transition:transform 2s ease-in-out}
#clock{position:relative;display:flex;align-items:baseline;font-family:var(--fnum);font-weight:var(--wn);font-variant-numeric:lining-nums tabular-nums;letter-spacing:0;
font-size:calc(min(27vw,42vh)*var(--cs));line-height:1;white-space:nowrap}
#clock .c{opacity:.9;margin:0 .02em;position:relative;top:-.06em;animation:b 2s ease-in-out infinite}
@keyframes b{50%{opacity:.25}}
#sec{margin-left:.4em;font-size:.26em;color:var(--sub);font-weight:300}
.dg{display:inline-block;width:var(--dw,.6em);text-align:center;font-weight:inherit;letter-spacing:0}
#sec:empty,#ap:empty{display:none}
#ap{margin-right:.5em;font-size:.2em;color:var(--sub);font-weight:400;white-space:nowrap}
#mid{display:flex;flex-direction:column;align-items:center;gap:1.5vmin}
#date{font-family:var(--fd,var(--ftxt));font-size:min(5vw,3.6vh);color:var(--sub);letter-spacing:.12em;font-weight:400}
.strip{display:flex;flex-wrap:wrap;gap:8px;width:min(920px,100%);justify-content:center}.strip:empty{visibility:hidden;height:40px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 22px;min-height:var(--bh);flex:1 1 auto;display:flex;align-items:center;min-width:0;white-space:nowrap;
-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
animation:in .7s var(--spring) both;overflow:hidden}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.94)}}
.card h4{display:none}.b{display:flex;gap:10px;align-items:baseline;flex:1;min-width:0;justify-content:center}
.wi{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.2em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#gear{display:flex;align-items:center;justify-content:center;padding:0}
.big{font-size:22px;font-weight:300;font-family:var(--fnum)}.sm{font-size:13px;color:var(--sub)}
.mq{display:flex;width:max-content;font-size:15px;animation:mq 60s linear infinite}.mq span{white-space:nowrap}.mq i{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.4;margin:0 1.3em;vertical-align:middle}@keyframes mq{to{transform:translateX(-50%)}}
.card.n{flex:1 1 100%}.card.n .b{justify-content:flex-start;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.news{font-size:15px;overflow:hidden;text-overflow:ellipsis}.b{transition:opacity .45s}
.cal{display:flex;gap:6px;font-size:13px;color:var(--sub)}.cal .d{padding:2px 7px;border-radius:10px}.cal .t{background:var(--acc);color:var(--onacc);font-weight:600}
.in{display:block;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font-size:16px;margin-top:6px}
.hint{display:block;font-size:12px;color:var(--sub);margin:6px 0;word-break:break-all}
.mu{display:flex;align-items:center;gap:10px;min-width:0;width:100%}
.card.m{flex:1 1 280px;max-width:100%}
.mtw{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap}.mtw.go{-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.mtw .ma{margin-left:.7em}.mtw .mq .ma{margin-left:.7em}
.mc{display:flex;align-items:center;justify-content:center;gap:2px;flex:none}
.cb{width:30px;height:30px;border:0;background:none;color:var(--fg);display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;padding:0;transition:transform .35s var(--spring),background .2s}
.cb:active{transform:scale(.85);background:var(--glass)}.cb svg{width:18px;height:18px;fill:currentColor;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round}
.card.big{flex:1 1 100%;border-radius:32px;padding:14px 22px}
.bg{display:flex;gap:18px;align-items:center;width:100%;min-width:0}
.art.big{width:104px;height:104px;flex:none}
[data-arot=off] .art{animation:none}[data-ashape=square] .art{border-radius:8px}[data-ashape=square] .art.big{border-radius:22px}
.bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;white-space:normal;text-align:left}
.bt .mt{font-size:20px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt .ma{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.pbf{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width 1s linear}
.tm{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.bt .mc{gap:14px}.card.big .cb{width:50px;height:50px}.card.big .cb svg{width:24px;height:24px}.card.big .cb.pp{background:var(--acc);color:var(--onacc)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,10px);padding:10px 18px;border-radius:999px;background:var(--sheet);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;opacity:0;pointer-events:none;transition:opacity .35s,transform .45s var(--spring);z-index:5;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.art{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;animation:sp 14s linear infinite}.art.pz{animation-play-state:paused}@keyframes sp{to{transform:rotate(360deg)}}
.mt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.ma{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wr{font-size:13px;color:var(--sub)}.wr span:last-child{color:var(--fg);margin-left:5px;font-variant-numeric:tabular-nums}
#gear{position:fixed;right:max(16px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top,0px) + 6px);width:36px;height:36px;border-radius:50%;
border:1px solid var(--line);background:var(--glass);color:var(--fg);font-size:17px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
transition:opacity .5s,transform .5s var(--spring);cursor:pointer}
body.idle #gear{opacity:0;pointer-events:none;transform:scale(.8)}
#gear.in{position:static;width:var(--bh);height:var(--bh);align-self:center;border-radius:50%;flex:none;opacity:.6}body.idle #gear.in{opacity:.5;pointer-events:auto;transform:none}
body.gin #stage{padding-top:18px}
.lt{flex:1;min-width:0;cursor:pointer}
.seg{display:flex;background:rgba(120,120,128,.25);border-radius:9px;padding:2px;margin:0 12px;flex:none}.seg button{border:0;background:none;color:var(--sub);font-size:13px;padding:4px 11px;border-radius:7px;cursor:pointer;transition:background .3s,color .3s}.seg button.on{background:var(--acc);color:var(--onacc)}
#dim{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .4s}
#sheet{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px)*.4 + 10px);margin:0 auto;max-width:520px;padding:12px 18px 10px;
background:var(--sheet);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);
border:1px solid var(--line);border-radius:28px;transform:translateY(calc(100% + 60px));transition:transform .6s var(--spring);max-height:88%;overflow:hidden;display:flex;flex-direction:column}
#sb{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0}
#sheet.open{transform:none}
#sheet h3{flex:none;margin:0 0 2px;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
#sheet h3 button{background:none;border:0;color:var(--acc);font-size:17px;font-weight:600;padding:8px 4px 8px 16px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.row small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.sec{font-size:12px;color:var(--sub);letter-spacing:.1em;margin:8px 0 0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.4);position:relative;transition:background .3s;flex:none;margin:0}
input[type=checkbox]::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .45s var(--spring);box-shadow:0 2px 4px rgba(0,0,0,.3)}
input[type=checkbox]:checked{background:#30d158}input[type=checkbox]:checked::after{transform:translateX(20px)}
input[type=range]{width:55%;accent-color:var(--acc)}
.btn{width:100%;margin-top:8px;padding:11px;border-radius:14px;border:0;background:var(--glass);color:var(--fg);font-size:16px;cursor:pointer}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.row.w{align-items:flex-start}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}.sw.on{box-shadow:0 0 0 2px var(--bg,#000),0 0 0 4px var(--acc)}
#fonts .ctl{justify-content:flex-start}.fg small{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
.pill{padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--fg);font-size:14px;cursor:pointer}.pill.on{background:var(--acc);color:var(--onacc)}
@media (max-height:430px){.art.big{width:72px;height:72px}[data-ashape=square] .art.big{border-radius:16px}.card.big{padding:10px 18px}.card.big .cb{width:42px;height:42px}.bt .mt{font-size:17px}#stage{padding-top:40px}:root{--bh:34px}.card{padding:5px 18px}.strip:empty{height:30px}}
</style>
</head>
<body>
<div id="stage">
  <div id="wt" class="strip"></div>
  <div id="mid">
  <div id="clock"><span id="ap"></span><span id="hh">00</span><span class="c">:</span><span id="mm">00</span><span id="sec"></span></div>
  <div id="date"></div>
  </div>
  <div id="wb" class="strip"></div>
</div>
<div id="toast"></div>
<button id="gear" aria-label="設定"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/></svg></button>
<div id="dim"></div>
<div id="sheet" role="dialog">
  <h3>設定<button id="done">完了</button></h3>
  <div id="sb">
  <p class="sec">ウィジェット(表示と上下の位置)</p>
  <div class="row"><label class="lt" for="w-weather">天気<small>現在地の天気と気温</small></label><div class="seg" data-p="weather"><button data-v="top">上</button><button data-v="bottom">下</button></div><input id="w-weather" type="checkbox" data-w="weather"></div>
  <div class="row"><label class="lt" for="w-news">ニュース<small>NHK主要ニュース</small></label><div class="seg" data-p="news"><button data-v="top">上</button><button data-v="bottom">下</button></div><input id="w-news" type="checkbox" data-w="news"></div>
  <div class="row"><label class="lt" for="w-cal">カレンダー<small>今月のカレンダー</small></label><div class="seg" data-p="cal"><button data-v="top">上</button><button data-v="bottom">下</button></div><input id="w-cal" type="checkbox" data-w="cal"></div>
  <div class="row"><label class="lt" for="w-world">世界時計<small>ニューヨーク・ロンドン・パリ</small></label><div class="seg" data-p="world"><button data-v="top">上</button><button data-v="bottom">下</button></div><input id="w-world" type="checkbox" data-w="world"></div>
  <div class="row"><label class="lt" for="w-music">音楽(Spotify)<small>いま再生中の曲</small></label><div class="seg" data-p="music"><button data-v="top">上</button><button data-v="bottom">下</button></div><input id="w-music" type="checkbox" data-w="music"></div>
  <div id="spbox">
    <input class="in" id="spid" placeholder="Spotify Client ID" autocomplete="off" autocapitalize="off" spellcheck="false">
    <small class="hint">Spotify側に登録するリダイレクトURI:<br><b id="spuri"></b></small>
    <button class="btn" id="splogin">Spotifyにログインして連携</button>
    <small class="hint" id="spst"></small>
    <input class="in" id="spcode" placeholder="連携コード(別の画面への引き継ぎ用)" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <button class="btn" id="rf">天気・ニュースを今すぐ更新</button>
  <p class="sec">表示</p>
  <label class="row"><span>24時間表示</span><input type="checkbox" data-o="h24"></label>
  <label class="row"><span>秒を表示</span><input type="checkbox" data-o="sec"></label>
  <label class="row"><span>焼き付き防止<small>1分ごとに表示を少しずらします</small></span><input type="checkbox" data-o="shift"></label>
  <label class="row"><span>ジャケットを回転</span><input type="checkbox" data-o="arot"></label>
  <div class="row"><span>ジャケットの形</span><div class="seg" id="ashape" style="margin-right:0"><button data-v="circle">丸</button><button data-v="square">四角(角丸)</button></div></div>
  <div class="row w"><span>テーマ</span><div class="ctl" id="themes"></div></div>
  <p class="sec">フォント</p><div id="fonts"></div>
  <div class="row"><span>文字が流れる速さ</span><input type="range" id="ns" min="10" max="120" step="5"></div>
  <div class="row"><span>明るさ</span><input type="range" id="br" min="0" max="85" value="0"></div>
  <button class="btn" id="fs">全画面にする</button>
    <p class="sec">アプリ</p>
    <input class="in" id="appurl" placeholder="再生画面アプリのURL(準備中)" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="openapp">再生画面アプリを開く</button>
  </div>
</div>
<script>
(function(){
// ---------- アイコン生成 (ホーム画面用 apple-touch-icon / favicon) ----------
function icon(n){
  var c=document.createElement('canvas');c.width=c.height=n;var g=c.getContext('2d'),s=n/180;
  var bg=g.createLinearGradient(0,0,0,n);bg.addColorStop(0,'#2c2c2e');bg.addColorStop(1,'#000');
  g.fillStyle=bg;g.fillRect(0,0,n,n);
  g.save();g.translate(n/2,n/2);g.scale(s,s);
  g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=5;g.lineCap='round';
  for(var i=0;i<12;i++){g.save();g.rotate(i*Math.PI/6);g.beginPath();g.moveTo(0,-66);g.lineTo(0,i%3?-60:-54);g.globalAlpha=i%3?.45:1;g.stroke();g.restore();}
  g.globalAlpha=1;g.lineWidth=8;
  g.save();g.rotate(Math.PI*2*(10/12+10/720));g.beginPath();g.moveTo(0,6);g.lineTo(0,-38);g.stroke();g.restore();
  g.lineWidth=6;g.save();g.rotate(Math.PI*2*(10/60));g.beginPath();g.moveTo(0,8);g.lineTo(0,-56);g.stroke();g.restore();
  g.strokeStyle='#ff9f0a';g.lineWidth=3;g.save();g.rotate(Math.PI*2*(50/60)*0+Math.PI*1.1);g.beginPath();g.moveTo(0,14);g.lineTo(0,-60);g.stroke();g.restore();
  g.fillStyle='#ff9f0a';g.beginPath();g.arc(0,0,6,0,7);g.fill();
  g.restore();return c.toDataURL('image/png');
}
try{document.getElementById('ati').href=icon(180);document.getElementById('fav').href=icon(64);}catch(e){}

// ---------- 設定 ----------
var D={arot:true,ashape:'circle',appurl:'',spid:'',shift:false,ns:40,pos:{weather:'top',cal:'top',world:'top',news:'bottom',music:'top'},theme:'dark',font:'jost',h24:true,sec:true,br:0,w:{weather:true,news:true,cal:false,world:false,music:false}};
try{var sv=JSON.parse(localStorage.getItem('okidokei')||'null');if(sv){D.ns=sv.ns||40;D.spid=sv.spid||'';D.arot=sv.arot!==false;D.ashape=sv.ashape||'circle';D.appurl=sv.appurl||'';D.shift=!!sv.shift;D.pos=Object.assign(D.pos,sv.pos||{});D.theme=sv.theme||'dark';D.font=sv.font||'jost';D.h24=sv.h24!==false;D.sec=sv.sec!==false;D.br=sv.br||0;D.w=Object.assign(D.w,sv.w||{});}}catch(e){}
function save(){try{localStorage.setItem('okidokei',JSON.stringify(D));}catch(e){}}
var $=function(i){return document.getElementById(i)};
var wd=['日','月','火','水','木','金','土'];

// ---------- 時計 ----------
var last='';
function setN(id,v){var e=$(id);if(e._v===v)return;e._v=v;e.innerHTML=v.split('').map(function(c){return '<b class="dg">'+c+'</b>'}).join('');}
var mctx=document.createElement('canvas').getContext('2d');
function measureDW(){
  try{var cs=getComputedStyle($('clock')),m=0;mctx.font=cs.fontWeight+' 100px '+cs.fontFamily;
  for(var i=0;i<10;i++)m=Math.max(m,mctx.measureText(String(i)).width);
  if(m>0)$('clock').style.setProperty('--dw',(m/100).toFixed(3)+'em');}catch(e){}
}
if(document.fonts){document.fonts.addEventListener('loadingdone',measureDW);document.fonts.ready.then(measureDW);}
function tick(){
  var d=new Date(),h=d.getHours(),ap='';
  if(!D.h24){ap=h<12?'午前':'午後';h=h%12||12;}
  var hs=D.h24?String(h).padStart(2,'0'):String(h);
  $('ap').textContent=ap;setN('hh',hs);setN('mm',String(d.getMinutes()).padStart(2,'0'));
  setN('sec',D.sec?String(d.getSeconds()).padStart(2,'0'):'');
  var ds=(d.getMonth()+1)+'月'+d.getDate()+'日 '+wd[d.getDay()]+'曜日';
  if(ds!==last){last=ds;$('date').textContent=ds;buildCal();}
  if(!D.shift)$('stage').style.transform='';
  else if(d.getSeconds()===0){var a=(d.getMinutes()%2?1:-1)*6;$('stage').style.transform='translate('+a+'px,'+(-a/2)+'px)';} // 焼き付き防止

var SPK='okidokei_sp';

  var ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));

  if(F.j){var st='"'+F.f+'",sans-serif';h.style.setProperty('--fd',st);h.style.setProperty('--ftxt',st);}else{h.style.removeProperty('--fd');h.style.removeProperty('--ftxt');}
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=TH[D.theme][1];
  document.querySelectorAll('.sw').forEach(function(b){b.classList.toggle('on',b.dataset.t===D.theme)});
  document.querySelectorAll('.pill').forEach(function(b){b.classList.toggle('on',b.dataset.f===D.font)});
  measureDW();
}
Object.keys(TH).forEach(function(t){var b=document.createElement('button');b.className='sw';b.dataset.t=t;b.setAttribute('aria-label',t);b.style.background=TH[t][0];b.onclick=function(){D.theme=t;save();look();};$('themes').appendChild(b);});
FL.forEach(function(g){var w=document.createElement('div');w.className='fg';w.innerHTML='<small>'+g[0]+'</small><div class="ctl"></div>';
  g[1].forEach(function(f){var b=document.createElement('button');b.className='pill';b.dataset.f=f[0];b.textContent=f[1];b.style.fontFamily='"'+f[2]+'",sans-serif';b.onclick=function(){D.font=f[0];save();look();};w.lastChild.appendChild(b);});
  $('fonts').appendChild(w);});
if(D.font!=='jost')loadFonts();
look();
(function(){var sg=$('ashape');function mark(){sg.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===D.ashape)});}
  mark();sg.querySelectorAll('button').forEach(function(b){b.onclick=function(){D.ashape=b.dataset.v;save();mark();look();};});})();
$('appurl').value=D.appurl;$('appurl').onchange=function(){D.appurl=this.value.trim();save();};
$('openapp').onclick=function(){var u=$('appurl').value.trim();if(!/^https?:\/\//i.test(u)){toast('先にアプリのURLを入力してください');return;}D.appurl=u;save();location.href=u;};
document.querySelectorAll('.seg[data-p]').forEach(function(sg){var k=sg.dataset.p;
  function mark(){sg.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===D.pos[k])});}
  mark();
  sg.querySelectorAll('button').forEach(function(b){b.onclick=function(){D.pos[k]=b.dataset.v;save();mark();syncW();};});
});
syncW();tick();wake();
})();
